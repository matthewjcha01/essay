<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbyZVv25-zBxV0-CCebo2sy9l4cRX0QmpOkS1VW5pK2IYeSWTReGFhfjVoPgspVn-uhv-g/exec";</script>
<title>Mind Grove Revision</title>
<style>
  :root {
    --bg: #F6F5F1;
    --card: #FFFFFF;
    --ink: #1C1C1A;
    --muted: #6B6A64;
    --line: #E4E2DA;
    --accent: #2F5D50;
    --accent-soft: #E7EFEC;
    --ok: #1E7B34;   --ok-bg: #E6F4EA;
    --mid: #9A5B00;  --mid-bg: #FFF4E0;
    --no: #B3261E;   --no-bg: #FCE8E6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.55;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 14px 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .brand { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: 22px; margin: 0; line-height: 1.2; }
  .meta { color: var(--muted); font-size: 14px; }
  .prompt { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 14px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; }
  /* 옆으로 나란히: 화면 한 장에 맞추고, 양쪽이 각자 스크롤 */
  @media (min-width: 640px) {
    html, body { height: 100%; }
    .wrap { height: 100vh; display: flex; flex-direction: column; }
    .grid { flex: 1; min-height: 0; }
    .fb { overflow: auto; min-height: 0; }
    .editor { display: flex; flex-direction: column; min-height: 0; }
    .editor .doc { flex: 1; min-height: 0; }
  }
  h2 { font-size: 17px; margin: 0 0 10px; }
  .score { display: flex; align-items: center; gap: 14px; background: var(--bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .score .big { font-size: 28px; font-weight: 800; line-height: 1; white-space: nowrap; flex: none; }
  .score .big small { font-size: 15px; font-weight: 600; color: var(--muted); }
  .score .parts { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .score.pass { background: var(--ok-bg); } .score.pass .big { color: var(--ok); }
  .waitbox { background: var(--accent-soft); border-radius: 12px; padding: 22px 18px; text-align: center; }
  .waitbox .w1 { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .waitbox .w2 { color: var(--ink); }
  .tnote { background: var(--mid-bg); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .tnote .label { color: var(--mid); }
  .due { display: inline-block; font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px;
         background: var(--accent-soft); color: var(--accent); margin-top: 4px; }
  .due.soon { background: var(--mid-bg); color: var(--mid); }
  .due.past { background: var(--no-bg); color: var(--no); }
  .closed { background: var(--no-bg); color: var(--no); border-radius: 10px; padding: 12px 14px; margin-top: 12px; }
  .closed b { display: block; margin-bottom: 2px; }
  .done { background: var(--ok-bg); color: var(--ok); border-radius: 10px; padding: 12px 14px; font-weight: 700; margin-top: 12px; }
  h3 { font-size: 14px; margin: 20px 0 8px; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; }
  .warn { background: var(--no-bg); color: var(--no); font-weight: 700; padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; }
  .goal { border-left: 4px solid var(--line); padding: 2px 0 2px 12px; margin: 0 0 14px; }
  .goal .g { font-weight: 600; }
  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin: 4px 0; }
  .ACHIEVED { border-color: var(--ok); } .ACHIEVED .chip { background: var(--ok-bg); color: var(--ok); }
  .PARTLY { border-color: var(--mid); } .PARTLY .chip { background: var(--mid-bg); color: var(--mid); }
  .NOTYET { border-color: var(--no); } .NOTYET .chip { background: var(--no-bg); color: var(--no); }
  .quote { font-style: italic; color: #333; margin: 2px 0; }
  .since { font-size: 14px; color: var(--muted); margin: 2px 0; }
  .fix { margin: 8px 0 0; padding-left: 22px; }
  .fix li { margin: 3px 0; }
  .fixlabel { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); margin-top: 8px; }
  .hintbox { background: var(--mid-bg); border-radius: 8px; padding: 8px 10px; margin-top: 8px; font-size: 15px; }
  .reason { color: var(--ink); }
  .before { color: var(--muted); }
  .after { font-weight: 600; }
  .last { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-weight: 600; }
  ul { margin: 6px 0 0; padding-left: 20px; }
  .hint { color: var(--muted); font-size: 14px; }
  /* 정식 에세이: 내 글에 단 코멘트 */
  .marked { font: 16px/1.85 "Times New Roman", Times, serif; color: #000; background: #fff; border: 1px solid var(--line);
            border-radius: 10px; padding: 14px 16px; margin: 4px 0 6px; }
  .marked .mp { margin: 0 0 4px; text-indent: .4in; }
  .marked .mp.c { text-indent: 0; text-align: center; }
  .marked mark { border-radius: 2px; padding: 0 1px; color: inherit; }
  .marked mark.fix { background: #fcd9d6; } .marked mark.check { background: #ffeaa8; } .marked mark.good { background: #d4efdc; }
  .marked sup { font: 700 10px -apple-system, sans-serif; color: var(--muted); margin-left: 1px; }
  .notes { margin: 2px 0 12px; padding: 0; list-style: none; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
  .notes li { display: flex; gap: 8px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .notes .n { flex: 0 0 auto; font-weight: 800; color: var(--muted); min-width: 18px; }
  .notes .tag { flex: 0 0 auto; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 1px 8px; height: fit-content; }
  .tag.fix { background: var(--no-bg); color: var(--no); } .tag.check { background: var(--mid-bg); color: var(--mid); }
  .tag.good { background: var(--ok-bg); color: var(--ok); }
  /* 에세이 편집기 — 쓰기 페이지처럼 MLA 모양 (Times New Roman, 두 줄 간격, 문단 들여쓰기) */
  .tools { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  .tool { width: 38px; height: 34px; min-height: 0; padding: 0; border: 1px solid var(--line); background: var(--card);
          color: var(--ink); border-radius: 6px; font: 16px "Times New Roman", Times, serif; cursor: pointer; }
  .tool.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .tool.wide { width: auto; padding: 0 10px; font: 13px -apple-system, "Segoe UI", sans-serif; }
  .tools .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
  .doc { width: 100%; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #fff;
         padding: 22px 26px; font: 17px/2 "Times New Roman", Times, serif; color: #000; outline: none; min-height: 50vh; }
  .doc:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .doc p { margin: 0; text-indent: .5in; min-height: 2em; }
  .doc p.c, .doc p[style*="center"] { text-indent: 0; text-align: center; }
  .doc[contenteditable="false"] { background: #FAFAF7; }
  .rules { margin-top: 10px; padding: 8px 12px; border: 1px solid #e3e6ea; border-radius: 8px; background: #f8f9fb; font-size: 13px; color: #4a5058; }
  .rules .rt { font-weight: 600; margin-bottom: 2px; }
  .rules ul { margin: 0; padding-left: 18px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .count { color: var(--muted); font-size: 14px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px;
    font: inherit; font-weight: 700; cursor: pointer; min-height: 46px;
  }
  button:disabled { opacity: .55; cursor: default; }
  .status { margin-top: 10px; font-size: 14px; color: var(--muted); min-height: 20px; }
  .status.err { color: var(--no); font-weight: 600; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.9s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .center { text-align: center; padding: 60px 16px; color: var(--muted); }
  .flash { animation: f 1.2s ease-out; }
  @keyframes f { from { background: var(--accent-soft); } to { background: var(--card); } }
  /* 선생님께 질문 · 답장 */
  .askbtn { background: var(--card); color: var(--accent); border: 1px solid var(--accent); padding: 10px 16px; min-height: 46px; }
  .askbtn.waiting { background: var(--mid-bg); color: var(--mid); border-color: var(--mid); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .askbox { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .askbox input { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; }
  .askbox button { padding: 10px 16px; min-height: 0; }
  .askbox .ghost { background: var(--card); color: var(--muted); border: 1px solid var(--line); }
  .reply { display: flex; gap: 10px; align-items: flex-start; background: var(--mid-bg); border: 1px solid #F0D3A3;
           border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .reply .rlabel { font-size: 12px; font-weight: 700; color: var(--mid); text-transform: uppercase; letter-spacing: .05em; }
  .reply .rx { margin-left: auto; background: none; color: var(--muted); padding: 0 6px; min-height: 0; font-size: 18px; }
  /* 폰처럼 아주 좁은 화면에서만 위아래로 */
  @media (max-width: 639px) {
    .grid { grid-template-columns: 1fr; }
    .doc { min-height: 55vh; padding: 16px; }
    .tool { width: 38px; }
    button { width: 100%; }
    .btns { width: 100%; }
    .reply .rx, .askbox button { width: auto; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="center"><span class="spin"></span>Loading…</div></div>

<script>
var TOKEN = (new URLSearchParams(location.search).get('t') || '').replace(/[^a-zA-Z0-9]/g, '');

// 서버 호출: GitHub 페이지에서 Apps Script로 직접 요청 (구글 계정과 무관하게 작동)
function call(fn, args, ok, fail) {
  fetch(window.API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (t) { var x = JSON.parse(t); if (x && x.__error) throw new Error(x.__error); ok(x.result); })
    .catch(function (e) { if (fail) fail(e); });
}
var state = null;

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function wordCount(s) {
  var m = plainText(s).trim().match(/\S+/g);
  return m ? m.length : 0;
}

// ── 서식 있는 글 ↔ 저장용 글 ──
//  저장 모양: 한 줄 = 한 문단. 굵게·기울임·밑줄은 <b> <i> <u>, 가운데 줄은 <center>…</center>
//  (시트에서도 읽을 수 있고, AI 도 이 표시로 이탤릭 등을 압니다)
// 저장된 글을 편집기에 넣었다 꺼낸 모양 (아무것도 안 고쳤는지 비교용)
function htmlToMarkupFrom(m) { var d = document.createElement('div'); d.innerHTML = markupToHtml(m); d.style.cssText = 'position:absolute;left:-9999px'; document.body.appendChild(d); var r = htmlToMarkup(d); d.remove(); return r; }
function plainText(s) { return String(s || '').replace(/<\/?(b|i|u|center)>/g, ''); }
function escH(s) { return String(s).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
function markupToHtml(m) {
  var lines = String(m || '').replace(/\r/g, '').split('\n');
  return lines.map(function (line) {
    var c = /^<center>[\s\S]*<\/center>$/.test(line);
    if (c) line = line.slice(8, -9);
    var h = escH(line).replace(/&lt;(\/?)(b|i|u)&gt;/g, '<$1$2>');
    return '<p' + (c ? ' class="c"' : '') + '>' + (h || '<br>') + '</p>';
  }).join('');
}
function htmlToMarkup(root) {
  var lines = [], cur = null;
  function newLine(center) { cur = { c: center, runs: [] }; lines.push(cur); }
  function addText(t, st) {
    if (!cur) newLine(false);
    t = t.replace(/ /g, ' ').replace(/\n/g, ' ');
    if (!t) return;
    var last = cur.runs[cur.runs.length - 1];
    if (last && last.b === st.b && last.i === st.i && last.u === st.u) last.t += t;
    else cur.runs.push({ t: t, b: st.b, i: st.i, u: st.u });
  }
  function walk(n, st, top) {
    if (n.nodeType === 3) { addText(n.data, st); return; }
    if (n.nodeType !== 1) return;
    var tag = n.tagName;
    if (tag === 'BR') { if (top) newLine(false); else if (cur && cur.runs.length) newLine(cur.c); return; }
    var cs = window.getComputedStyle(n);
    var block = /^(P|DIV|H\d|LI|BLOCKQUOTE)$/.test(tag);
    if (block) newLine(cs.textAlign === 'center' || n.classList.contains('c') || n.getAttribute('align') === 'center');
    var s2 = {
      b: st.b || tag === 'B' || tag === 'STRONG' || Number(cs.fontWeight) >= 600,
      i: st.i || tag === 'I' || tag === 'EM' || cs.fontStyle === 'italic',
      u: st.u || tag === 'U' || /underline/.test(cs.textDecorationLine || cs.textDecoration || '')
    };
    for (var k = n.firstChild; k; k = k.nextSibling) walk(k, s2, false);
    if (block) cur = null;
  }
  for (var k = root.firstChild; k; k = k.nextSibling) walk(k, { b: false, i: false, u: false }, true);
  var out = lines.map(function (L) {
    var t = L.runs.map(function (r) {
      var x = escTagChars(r.t);
      if (r.u) x = '<u>' + x + '</u>';
      if (r.i) x = '<i>' + x + '</i>';
      if (r.b) x = '<b>' + x + '</b>';
      return x;
    }).join('');
    return L.c && t ? '<center>' + t + '</center>' : t;
  });
  while (out.length && !plainText(out[out.length - 1]).trim()) out.pop();
  return out.join('\n');
}
// 학생이 직접 쓴 "<i>" 같은 글자가 서식으로 바뀌지 않게
function escTagChars(t) { return t.replace(/<(\/?(b|i|u|center))>/g, '‹$1›'); }
function makeEditor(markup) {
  var d = el('div', 'doc');
  d.id = 'essay'; d.contentEditable = 'true'; d.spellcheck = true;
  d.setAttribute('lang', 'en');
  try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (e) {}
  d.innerHTML = markupToHtml(markup);
  Object.defineProperty(d, 'value', {
    get: function () { return htmlToMarkup(d); },
    set: function (v) { d.innerHTML = markupToHtml(v); }
  });
  Object.defineProperty(d, 'readOnly', {
    get: function () { return d.contentEditable === 'false'; },
    set: function (v) { d.contentEditable = v ? 'false' : 'true'; }
  });
  // 비우면 문단 하나는 남겨 두기 (들여쓰기가 유지되게)
  d.addEventListener('input', function () { if (!d.firstChild) d.innerHTML = '<p><br></p>'; });
  return d;
}

function renderGoalsOnly(box, goals) {
  if (state.full) {
    box.appendChild(el('h2', null, 'Your first draft'));
    box.appendChild(el('p', 'hint', 'Read the comments on every paragraph. Fix the red and yellow parts in your essay, then press Submit to get a new score.'));
  } else {
    box.appendChild(el('h2', null, 'Your revision goals'));
    box.appendChild(el('p', 'hint', 'Fix these 3 things in your essay. Then press Submit to get feedback.'));
  }
  var fr = state.formal ? state.firstReview : null;
  var t = el('div', 'score');
  if (state.formal) {
    if (state.firstScore != null) {
      var big0 = el('div', 'big', String(state.firstScore));
      big0.appendChild(el('small', null, ' / 100 (' + state.firstLetter + ')'));
      t.appendChild(big0);
    }
    t.appendChild(el('div', 'parts', (state.firstScore != null ? 'Your score now. ' : '') +
      'Goal: reach ' + (state.passScore || 80) + ' (B-), and your teacher will check your essay.'));
  } else {
    t.appendChild(el('div', 'big', String(state.passScore || 10)));
    t.appendChild(el('div', 'parts', 'Reach ' + (state.passScore || 10) + ' / 12 to finish.' +
      (state.firstScore != null ? ' Your first draft scored ' + state.firstScore + ' / 12.' : '')));
  }
  box.appendChild(t);
  if (state.formal && !fr) {
    var wait = el('div', 'hint'); wait.id = 'frWait';
    wait.innerHTML = '<span class="spin"></span>Your teacher’s comments on every paragraph are loading… (about 1 minute)';
    box.appendChild(wait);
    loadFirstReview();
  }
  if (fr && state.teacherNote) {
    var tn0 = el('div', 'tnote');
    tn0.appendChild(el('div', 'label', 'From your teacher'));
    tn0.appendChild(el('div', null, state.teacherNote));
    box.appendChild(tn0);
  }
  if (fr && fr.topic_warning) box.appendChild(el('div', 'warn', '⚠ ' + fr.topic_warning));
  if (fr && fr.annotations && fr.annotations.length) renderMarked(box, fr.annotations, state.essay);
  if (fr && goals.length) box.appendChild(el('h3', null, 'Your goals'));
  goals.forEach(function (g, i) {
    var d = el('div', 'goal');
    d.appendChild(el('div', 'g', (i + 1) + '. ' + g));
    var fg = fr && fr.goals && fr.goals[i];
    if (fg) {
      if (fg.reason) d.appendChild(el('div', 'reason', fg.reason));
      var steps = (fg.how_to_fix || []).filter(function (x) { return x; });
      if (steps.length) {
        d.appendChild(el('div', 'fixlabel', 'How to fix'));
        var ol = el('ol', 'fix');
        steps.forEach(function (x) { ol.appendChild(el('li', null, x)); });
        d.appendChild(ol);
      }
      if (fg.hint) d.appendChild(el('div', 'hintbox', '💡 ' + fg.hint));
    }
    box.appendChild(d);
  });
  if (fr && fr.one_last_thing) { box.appendChild(el('h3', null, 'Start here')); box.appendChild(el('div', 'last', fr.one_last_thing)); }
  if (state.grammar) {
    box.appendChild(el('h3', null, 'Grammar focus'));
    box.appendChild(el('p', null, state.grammar));
  } else if (state.full && fr && fr.grammar && fr.grammar.focus) {
    box.appendChild(el('h3', null, 'Grammar check: ' + fr.grammar.focus));
    var gl = (fr.grammar.remaining || []).filter(function (x) { return x; });
    if (gl.length) {
      box.appendChild(el('p', 'hint', 'Find these in your essay and fix them yourself:'));
      var gu = el('ul'); gl.forEach(function (t) { gu.appendChild(el('li', null, '“' + t + '”')); }); box.appendChild(gu);
    }
  }
}

function renderFeedback(box, fb, count) {
  box.appendChild(el('h2', null, 'Feedback on submission ' + count));
  if (state.teacherNote) {
    var tn = el('div', 'tnote');
    tn.appendChild(el('div', 'label', 'From your teacher'));
    tn.appendChild(el('div', null, state.teacherNote));
    box.appendChild(tn);
  }
  if (state.formal && fb.score && fb.score.total != null) {
    var sc2 = el('div', 'score' + (state.done ? ' pass' : ''));
    var big2 = el('div', 'big', String(fb.score.total));
    big2.appendChild(el('small', null, ' / 100' + (fb.score.letter ? ' (' + fb.score.letter + ')' : '')));
    sc2.appendChild(big2);
    sc2.appendChild(el('div', 'parts',
      'Intro ' + fb.score.intro + '/20 · Body ' + fb.score.body + '/40 · Conclusion ' + fb.score.conclusion +
      '/15 · Language ' + fb.score.language + '/25' +
      (state.done ? '' : ' — reach ' + (state.passScore || 80) + ' (B-) for your teacher to check')));
    box.appendChild(sc2);
  } else if (fb.score && fb.score.total != null) {
    var pass = fb.score.total >= (state.passScore || 10);
    var sc = el('div', 'score' + (pass ? ' pass' : ''));
    var big = el('div', 'big', String(fb.score.total));
    big.appendChild(el('small', null, ' / 12'));
    sc.appendChild(big);
    sc.appendChild(el('div', 'parts',
      'Task ' + fb.score.task + ' · Organization ' + fb.score.organization +
      ' · Development ' + fb.score.development + ' · Language ' + fb.score.language +
      (pass ? '' : ' — reach ' + (state.passScore || 10) + ' to finish')));
    box.appendChild(sc);
  }
  if (fb.topic_warning) box.appendChild(el('div', 'warn', '⚠ ' + fb.topic_warning));

  if (state.formal && fb.annotations && fb.annotations.length) renderMarked(box, fb.annotations, state.essay);

  // NGL: new goals (all 3 old goals reached, score not 10 yet) — show them first
  var newGoals = null;
  if (!state.formal) {
    if (fb.new_goals && fb.new_goals.length) newGoals = fb.new_goals;
    else if ((state.goals || []).length) {
      var oldSet = (fb.goals || []).map(function (g) { return String(g.goal || '').trim(); }).join('|');
      var nowSet = state.goals.map(function (g) { return String(g || '').trim(); }).join('|');
      if (!(fb.goals || []).length || oldSet !== nowSet) newGoals = state.goals;
    }
  }
  if (newGoals) {
    box.appendChild(el('h3', null, 'Your NEW goals'));
    box.appendChild(el('p', 'hint', 'You reached all 3 of your old goals. Fix these 3 things next, then press Submit.'));
    newGoals.forEach(function (g, i) {

  }

  if (fb.since_last) box.appendChild(el('div', 'since', 'Since last time: ' + fb.since_last));
  if ((fb.goals || []).length && !newGoals) box.appendChild(el('h3', null, '1. Your goals'));
  var labels = { 'ACHIEVED': 'Achieved', 'PARTLY': 'Partly', 'NOT YET': 'Not yet' };
  (fb.goals || []).forEach(function (g, i) {
    var v = String(g.verdict || '').toUpperCase();

    d.appendChild(el('div', 'g', 'Goal ' + (i + 1) + ': ' + (g.goal || state.goals[i] || '')));
    d.appendChild(el('span', 'chip', labels[v] || v));
    if (g.since_last) d.appendChild(el('div', 'since', 'Since last time: ' + g.since_last));
    if (g.quote) d.appendChild(el('div', 'quote', '“' + g.quote + '”'));
    d.appendChild(el('div', 'reason', g.reason || ''));
    var steps = (g.how_to_fix || []).filter(function (x) { return x; });
    if (steps.length) {

    }
    if (g.hint) d.appendChild(el('div', 'hintbox', '💡 ' + g.hint));
    box.appendChild(d);
  });

  if (fb.improvement && fb.improvement.before) {
    box.appendChild(el('h3', null, '2. What got better'));
    box.appendChild(el('div', 'before', 'Before: ' + fb.improvement.before));
    box.appendChild(el('div', 'after', 'After: ' + fb.improvement.after));

  box.appendChild(el('h3', null, '3. One last thing'));

  var gr = fb.grammar || {};

  if (newGoals) return;   // old grammar focus is done; the new one is shown with the new goals
  if (state.full && !gr.focus && !rem.length) return;
  box.appendChild(el('h3', null, '4. Grammar check' + (gr.focus ? ': ' + gr.focus : '')));
  if (rem.length) {

    var ul = el('ul');

    box.appendChild(ul);
  } else {

  }
}

// 정식 에세이: 제출한 글 위에 선생님처럼 표시 + 문단마다 코멘트
function renderMarked(box, anns, essay) {
  box.appendChild(el('h3', null, 'Comments on your essay'));
  box.appendChild(el('p', 'hint', 'Red = must fix · Yellow = think again · Green = this works. Fix them in your essay on the right.'));
  var norm = function (t) { return String(t || '').replace(/[‘’]/g, "'").replace(/[“”]/g, '"'); };
  var paras = String(essay || '').split('\n').map(function (line) {
    var c = /^<center>[\s\S]*<\/center>$/.test(line);
    return { c: c, t: plainText(line) };
  });
  // 빈 줄을 뺀 문단 번호 (AI 가 세는 방식)
  var real = []; paras.forEach(function (p, i) { if (p.t.trim()) real.push(i); });
  var byPara = {}, loose = [], num = 0;
  anns.forEach(function (a) {
    num++; a._n = num;
    var kind = /^(fix|check|good)$/.test(a.kind) ? a.kind : 'check'; a._k = kind;
    var q = norm(a.quote).trim(), hit = -1, at = -1;
    var guess = real[(Number(a.para) || 0) - 1];
    var order = guess != null ? [guess].concat(real.filter(function (x) { return x !== guess; })) : real;
    for (var k = 0; q && k < order.length; k++) {
      var pos = norm(paras[order[k]].t).indexOf(q);
      if (pos === -1) pos = norm(paras[order[k]].t).toLowerCase().indexOf(q.toLowerCase());
      if (pos !== -1) { hit = order[k]; at = pos; break; }
    }
    if (hit === -1) { (guess != null ? (byPara[guess] = byPara[guess] || []) : loose).push(a); a._at = -1; return; }
    a._at = at; a._len = q.length;
    (byPara[hit] = byPara[hit] || []).push(a);
  });
  var wrap = el('div', 'marked');
  real.forEach(function (i) {
    var p = paras[i], list = (byPara[i] || []).slice();
    var spans = list.filter(function (a) { return a._at >= 0; }).sort(function (x, y) { return x._at - y._at; });
    var html = '', pos = 0;
    spans.forEach(function (a) {
      if (a._at < pos) return;                     // 겹치면 표시는 건너뛰고 코멘트만
      html += escH(p.t.slice(pos, a._at)) + '<mark class="' + a._k + '">' + escH(p.t.slice(a._at, a._at + a._len)) +
              '</mark><sup>' + a._n + '</sup>';
      pos = a._at + a._len;
    });
    html += escH(p.t.slice(pos));
    var d = el('div', 'mp' + (p.c ? ' c' : '')); d.innerHTML = html;
    wrap.appendChild(d);
    if (list.length) {
      list.sort(function (x, y) { return x._n - y._n; });
      var ul = el('ul', 'notes');
      list.forEach(function (a) { ul.appendChild(noteLi(a)); });
      wrap.appendChild(ul);
    }
  });
  if (loose.length) { var ul2 = el('ul', 'notes'); loose.forEach(function (a) { ul2.appendChild(noteLi(a)); }); wrap.appendChild(ul2); }
  box.appendChild(wrap);
}
function noteLi(a) {
  var li = el('li');
  li.appendChild(el('span', 'n', String(a._n)));
  li.appendChild(el('span', 'tag ' + a._k, (a.part || '') + (a._k === 'fix' ? ' · fix' : a._k === 'good' ? ' · good' : ' · check')));
  var t = el('span', null, (a._at === -1 && a.quote ? '“' + a.quote + '” — ' : '') + (a.note || ''));
  li.appendChild(t);
  return li;
}

// 마감일 표시: due 가 없으면(옛 서버·Pathways) 아무것도 안 보임
function dueChip(due, goal) {
  if (!due) return null;
  var g = goal ? ' · Goal: ' + goal : '';
  if (!due.at) return el('div', 'due', 'Due: Open' + g);
  if (due.closed) return el('div', 'due past', 'Past due: ' + due.text);
  var left = due.at - Date.now(), h = Math.floor(left / 3600000);
  var soon = left < 48 * 3600000;
  var tail = !soon ? '' : left < 3600000 ? ' · less than 1 hour left' : h < 24 ? ' · ' + h + (h === 1 ? ' hour' : ' hours') + ' left' : ' · 1 day left';
  return el('div', 'due' + (soon ? ' soon' : ''), 'Due: ' + due.text + tail + g);
}

function submit() {
  var ta = document.getElementById('essay');
  var btn = document.getElementById('submit');
  var st = document.getElementById('status');
  var text = ta.value;
  if (wordCount(text) < 20) { st.className = 'status err'; st.textContent = 'Your essay is too short.'; return; }
  if (text.trim() === htmlToMarkupFrom(state.essay).trim()) {
    st.className = 'status err'; st.textContent = 'You have not changed anything yet. Revise first, then submit.'; return;
  }
  var lim = state.limit || {};
  if (!lim.off && lim.nextAt && lim.nextAt > Date.now()) {
    var m = Math.ceil((lim.nextAt - Date.now()) / 60000);
    st.className = 'status err';
    st.textContent = 'You can submit again in ' + m + (m === 1 ? ' minute' : ' minutes') +
      '. Use this time to read your feedback and fix more than one thing.';
    return;
  }
  if (!lim.off && lim.perDay && lim.left === 0) {
    st.className = 'status err';
    st.textContent = 'You have used all ' + lim.perDay + ' submissions for today. Keep revising. You can submit again tomorrow.';
    return;
  }
  btn.disabled = true; ta.readOnly = true;
  st.className = 'status';
  st.innerHTML = '<span class="spin"></span>Reading your essay… this takes about ' + (state.formal ? '1–2 minutes' : '30 seconds') +
    '. Do not close this page.';
  call('revSubmit', [TOKEN, text], function (res) {
      state.feedback = res.feedback || null; state.count = res.count; state.essay = text;
      if (res.feedback && res.feedback.new_goals && res.feedback.new_goals.length) {
        state.goals = res.feedback.new_goals.slice();
        if (res.feedback.next_grammar) state.grammar = res.feedback.next_grammar;
      }
      state.score = res.score; state.done = res.done; if (res.passScore) state.passScore = res.passScore;
      state.pending = !!res.pending; state.letter = res.letter || ''; state.teacherNote = ''; state.returned = false;
      if (state.limit && !state.limit.off) {
        state.limit.nextAt = Date.now() + (state.limit.gapMin || 10) * 60000;
        state.limit.left = Math.max(0, (state.limit.left || 1) - 1);
      }
      try { localStorage.removeItem('mg-draft-' + TOKEN); } catch (e) {}
      render();
      var fb = document.getElementById('fb');
      fb.classList.add('flash');
      fb.scrollTop = 0;
      if (window.innerWidth < 640) fb.scrollIntoView({ behavior: 'smooth', block: 'start' });
      var s2 = document.getElementById('status');
      if (state.pending) s2.textContent = 'You reached your goal! Your teacher will give you final feedback.';
      else if (!state.done) s2.textContent = 'Submitted! Read the feedback, then keep revising.';
      if (state.done) LIVE.asking = false;
      liveSend();
    }, function (err) {
      btn.disabled = false; ta.readOnly = false;
      st.className = 'status err';
      var msg = String(err && err.message || err);
      if (msg.indexOf('LIMIT: ') === 0) st.textContent = msg.slice(7);
      else if (msg.indexOf('CLOSED: ') === 0) {
        st.textContent = msg.slice(8);
        btn.style.display = 'none'; ta.readOnly = true;
        if (state.due) state.due.closed = true;
      }
      else st.textContent = 'Something went wrong. Your text is still here. Try again, or tell your teacher. (' + msg + ')';
    });
}

// ── 실시간: 선생님 수업 모니터로 보내기 ──
//   고치는 중이면 1.5초 뒤(최대 5초마다), 아무것도 안 해도 15초마다, 질문 중이면 3.5초마다.
var LIVE = { busy: false, again: false, t: null, lastInput: Date.now(), lastSent: 0, started: false,
             ok: false, asking: false, askSend: undefined, replyT: 0, lastReply: '',
             pastes: 0, aways: 0, hiddenAt: 0 };
var KO = /[ᄀ-ᇿ㄰-㆏가-힯]/g;

function livePayload() {
  var ta = document.getElementById('essay');
  var text = ta ? ta.value : (state ? state.essay : '');
  var fb = state && state.feedback;
  return {
    text: text, wc: wordCount(text), base: state ? String(state.essay || '') : '',
    idle: Math.round((Date.now() - LIVE.lastInput) / 1000),
    pastes: LIVE.pastes, aways: LIVE.aways,
    score: state && state.score != null ? state.score : null, letter: state ? state.letter || '' : '',
    pass: state ? state.passScore || 0 : 0, count: state ? state.count || 0 : 0,
    formal: !!(state && state.formal), pending: !!(state && state.pending), done: !!(state && state.done),
    goals: fb && fb.goals ? fb.goals.map(function (g) { return { v: g.verdict, t: g.goal }; }) : null
  };
}
function liveSoon() {
  if (!LIVE.started) return;
  clearTimeout(LIVE.t);
  LIVE.t = setTimeout(liveSend, Date.now() - LIVE.lastSent > 5000 ? 0 : 1500);
}
function liveSend() {
  if (!LIVE.started || !state) return;
  if (LIVE.busy) { LIVE.again = true; return; }
  if (!navigator.onLine) return;
  LIVE.busy = true; LIVE.lastSent = Date.now();
  var p = livePayload();
  var sentAsk = LIVE.askSend; LIVE.askSend = undefined;
  if (sentAsk !== undefined) p.ask = sentAsk;
  call('revLive', [TOKEN, JSON.stringify(p)], function (r) {
    LIVE.busy = false;
    if (r && r.ok) {
      if (!LIVE.ok) { LIVE.ok = true; drawAsk(); }
      if (r.reply && r.reply.t > LIVE.replyT) {
        var fresh = LIVE.replyT > 0 || LIVE.asking || Date.now() - r.reply.t < 10 * 60000;
        LIVE.replyT = r.reply.t;
        try { localStorage.setItem('mg-rep-' + TOKEN, String(r.reply.t)); } catch (e) {}
        if (fresh) showReply(r.reply.msg);
      }
      // 선생님이 답장했거나 '확인'을 눌렀으면 기다림 끝
      if (LIVE.asking && !r.ask && sentAsk === undefined && LIVE.askSend === undefined) { LIVE.asking = false; drawAsk(); }
    } else if (sentAsk !== undefined && LIVE.askSend === undefined) LIVE.askSend = sentAsk;
    if (LIVE.again) { LIVE.again = false; liveSoon(); }
  }, function () {
    LIVE.busy = false;
    if (sentAsk !== undefined && LIVE.askSend === undefined) LIVE.askSend = sentAsk;
  });
}
function liveStart() {
  if (LIVE.started) return;
  LIVE.started = true;
  try { LIVE.replyT = Number(localStorage.getItem('mg-rep-' + TOKEN)) || 0; } catch (e) {}
  liveSend();
  setInterval(function () {
    if (LIVE.asking || LIVE.askSend !== undefined) { if (Date.now() - LIVE.lastSent > 3500) liveSend(); }
    else if (Date.now() - LIVE.lastSent > 15000) liveSend();
  }, 1000);
  // 5초 이상 다른 화면에 갔다 오면 '화면 이탈' 1회 (선생님 화면 참고용)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) LIVE.hiddenAt = Date.now();
    else if (LIVE.hiddenAt) { if (Date.now() - LIVE.hiddenAt >= 5000) LIVE.aways++; LIVE.hiddenAt = 0; liveSoon(); }
  });
}
function drawAsk() {
  var b = document.getElementById('askBtn');
  if (!b) return;
  b.style.visibility = LIVE.ok ? 'visible' : 'hidden';
  b.classList.toggle('waiting', LIVE.asking);
  b.textContent = LIVE.asking ? '⏳ Waiting for Mr. Cha…' : '✋ Ask Mr. Cha';
  b.title = LIVE.asking ? 'Click to cancel your question' : 'Mr. Cha will look at your essay now';
}
function askClick() {
  if (LIVE.asking) {             // 다시 누르면 질문 취소
    LIVE.asking = false; LIVE.askSend = false; drawAsk(); liveSend();
    status('Your question was canceled.'); return;
  }
  var box = document.getElementById('askBox');
  box.style.display = 'flex';
  var i = document.getElementById('askIn'); i.value = ''; i.focus();
}
function askSend() {
  var q = document.getElementById('askIn').value.replace(KO, '').replace(/\s+/g, ' ').trim();
  LIVE.asking = true; LIVE.askSend = q; drawAsk();
  document.getElementById('askBox').style.display = 'none';
  liveSend();
  status('Sent! Keep revising — Mr. Cha will look at your essay.');
}
function showReply(msg, quiet) {
  LIVE.lastReply = msg;
  var bar = document.getElementById('replyBar');
  if (!bar) return;
  document.getElementById('replyMsg').textContent = msg;
  bar.style.display = 'flex';
  if (!quiet) { bar.classList.remove('flash'); void bar.offsetWidth; bar.classList.add('flash'); }
}
function status(msg) {
  var s = document.getElementById('status');
  if (s) { s.className = 'status'; s.textContent = msg; }
}

call('revGetPageData', [TOKEN], function (data) {
    if (!data) {
      document.getElementById('app').innerHTML =
        '<div class="center">This link does not work anymore.<br><br>' +
        'Open the <b>essay submission link</b> on <b>Google Classroom</b>, log in, ' +
        'and open your essay from <b>My essays</b>.</div>';
      return;
    }
    state = data;
    try {
      var saved = localStorage.getItem('mg-draft-' + TOKEN);
      if (saved && saved.trim() && saved !== state.essay) state.essayUnsaved = saved;
    } catch (e) {}
    render();
    liveStart();
    if (state.essayUnsaved) {
      document.getElementById('essay').value = state.essayUnsaved;
      document.getElementById('status').textContent = 'We restored the changes you had not submitted yet.';
      document.querySelector('.count').textContent = wordCount(state.essayUnsaved) + ' words';
    }
  }, function (err) {
    document.getElementById('app').innerHTML = '';
    var d = el('div', 'center', 'Could not load your page. (' + (err && err.message || err) + ')');
    document.getElementById('app').appendChild(d);
  });
</script>
</body>
</html>
